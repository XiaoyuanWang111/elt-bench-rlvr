[project]
name = "elt-bench-rlvr"
version = "0.1.0"
description = "A Tinker RLVR environment for ELT-Bench: a model builds an ELT pipeline with tools and is rewarded from the executed warehouse state."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Xiaoyuan Wang" }]
requires-python = ">=3.11"
dependencies = [
    "tinker-cookbook>=0.3.0",
    "tinker>=0.38.0",
    "chz>=0.4.0",
    "duckdb>=1.1.0",
    "sqlglot>=25.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.12.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "ruff==0.14.3",
    "black==25.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elt_rlvr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "tokenizer: needs a public tokenizer download from Hugging Face (no credentials)",
    "tinker: needs TINKER_API_KEY",
    "snowflake: needs Snowflake and Airbyte credentials",
]

[tool.ruff]
line-length = 121
target-version = "py311"

[tool.ruff.lint]
select = [
    "A", "B", "E", "F", "I", "NPY", "RUF", "UP", "W",
    "N805", "PLR0124", "PLR1722", "RET502", "RET503", "SIM115", "PLC0415",
    "TID252", "ICN001",
]
ignore = ["F722", "B008", "UP015", "UP046", "UP047", "A005", "E741"]

[tool.black]
line-length = 121
target-version = ["py311"]
